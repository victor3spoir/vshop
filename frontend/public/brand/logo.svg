<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- vshop logo: bold V at the left, shop (awning storefront) at the right -->
  <rect width="512" height="512" rx="96" fill="#2563eb"/>
  <!-- V, left side -->
  <path d="M76 160 L154 372 L232 160"
        fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shop, right side: awning + storefront with door -->
  <!-- awning top bar -->
  <rect x="284" y="140" width="172" height="22" rx="11" fill="#ffffff"/>
  <!-- awning scallops: 3 -->
  <path d="M290 162 h160 v26
           a26.6 26.6 0 0 1 -53.3 0
           a26.6 26.6 0 0 1 -53.3 0
           a26.6 26.6 0 0 1 -53.3 0
           z"
        fill="#ffffff"/>
  <!-- storefront body -->
  <path d="M302 240 h136 a12 12 0 0 1 12 12 v108 a12 12 0 0 1 -12 12 h-136 a12 12 0 0 1 -12 -12 v-108 a12 12 0 0 1 12 -12 z"
        fill="#ffffff"/>
  <!-- door cutout -->
  <rect x="344" y="292" width="52" height="80" rx="8" fill="#2563eb"/>
</svg>
